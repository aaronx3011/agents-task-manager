name: atm-dev

# Development deployment. The pipeline ships the image (docker save/load over
# SSH); IMAGE_TAG is exported by scripts/deploy.sh, e.g. the commit SHA.

x-web: &web
  image: agents-task-manager:${IMAGE_TAG:-latest}
  environment: &web-environment
    DJANGO_DEBUG: "false"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Generate once on the host, see scripts/deploy.sh}
    DATABASE_URL: postgresql://coordinator:${POSTGRES_PASSWORD:?Generated once on the host}@db:5432/coordinator
    REDIS_URL: redis://redis:6379/0
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,10.8.0.11,atm.aaron-henriquez.com}
    DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://atm.aaron-henriquez.com,http://10.8.0.11:8000,http://localhost:8000}
    DJANGO_SECURE_SSL_REDIRECT: "false"
    DJANGO_SECURE_COOKIES: "true"
    DJANGO_TRUST_PROXY: "true"
    WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    WORKER_OFFLINE_SECONDS: ${WORKER_OFFLINE_SECONDS:-10}
    WORKER_SESSION_KEEP: ${WORKER_SESSION_KEEP:-500}
    WORKER_MESSAGE_KEEP: ${WORKER_MESSAGE_KEEP:-120}
    WORKER_EVENT_KEEP: ${WORKER_EVENT_KEEP:-5000}
    WORKER_EVENT_MAX_BYTES: ${WORKER_EVENT_MAX_BYTES:-65536}
    WORKER_SYNC_MAX_BYTES: ${WORKER_SYNC_MAX_BYTES:-8388608}
    WORKER_COMMAND_QUEUE_CAP: ${WORKER_COMMAND_QUEUE_CAP:-100}
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coordinator
      POSTGRES_USER: coordinator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generated once on the host}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coordinator -d coordinator"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  web:
    <<: *web
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && exec uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers $${WEB_CONCURRENCY}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
  reaper:
    <<: *web
    command: ["sh", "-c", "while true; do python manage.py release_stale_tasks --minutes ${TASK_CLAIM_TIMEOUT_MINUTES:-15} || exit 1; sleep ${TASK_REAPER_INTERVAL_SECONDS:-300}; done"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
