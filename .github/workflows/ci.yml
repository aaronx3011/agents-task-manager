name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.3"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run format:check --prefix frontend
      - run: npm run build --prefix frontend
      - name: Install production-static browser test dependencies
        run: uv run --with playwright python -m playwright install --with-deps chromium
      - name: Verify collected frontend module graph in a browser
        run: uv run --with playwright python scripts/verify_opencode_dashboard.py --assets-only
      - run: node --test --test-timeout=30000 bridge/bridge.test.mjs frontend/tests/session-live.test.mjs
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py collectstatic --noinput
      - run: uv run pytest
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: coordinator
          POSTGRES_USER: coordinator
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coordinator -d coordinator"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://coordinator:ci-only-password@localhost:5432/coordinator
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.3"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: uv run python manage.py migrate --noinput
      - run: uv run python manage.py collectstatic --noinput
      - run: uv run pytest
