name: Task or change
description: Specify work for an agent or a human.
title: "[Task] "
labels: [needs-triage]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal and context
      description: Include the project and links to related documentation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe observable completion and verification.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and live coordinator task
      description: Link blocker issues and coordinator task IDs when available.
