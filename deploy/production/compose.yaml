# Production VPS1 — the app host (#52).
#
#   Internet ──443──> front (Caddy: TLS, SPA, proxy) ──> web (Django/uvicorn) ──> redis
#                                                          │
#                                     private network ─────┴──> VPS2 Postgres (deploy/production-db)
#
# Caddy terminates TLS itself (Let's Encrypt over ACME), so nothing else sits in
# front: DJANGO_NUM_PROXIES is 1. PostgreSQL lives on VPS2 and is reached only over
# the private network (DB_HOST is VPS2's private address); see the runbook in
# https://github.com/aaronx3011/agents-task-manager/issues/3.
#
# Required in deploy/production/.env (never committed): DJANGO_SECRET_KEY,
# POSTGRES_PASSWORD, DB_HOST, SITE_ADDRESS (public hostname) and TLS (ACME contact
# email). Deploy only after the GitHub "production" environment requires a human
# reviewer and the restore drill on VPS2 has passed.

name: atm-prod

x-web: &web
  image: agents-task-manager:${IMAGE_TAG:-latest}
  environment: &web-environment
    DJANGO_DEBUG: "false"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set in the production environment}
    DATABASE_URL: postgresql://coordinator:${POSTGRES_PASSWORD:?Set in the production environment}@${DB_HOST:?Set to the database host private address}:${DB_PORT:-5432}/coordinator
    REDIS_URL: redis://redis:6379/0
    # The public name, plus loopback for in-container health checks.
    DJANGO_ALLOWED_HOSTS: ${SITE_ADDRESS:?Set to the public hostname},127.0.0.1,localhost
    DJANGO_CSRF_TRUSTED_ORIGINS: https://${SITE_ADDRESS}
    DJANGO_SECURE_SSL_REDIRECT: "true"
    DJANGO_SECURE_COOKIES: "true"
    DJANGO_TRUST_PROXY: "true"
    # Caddy is the only proxy in front of Django.
    DJANGO_NUM_PROXIES: "1"
    # Superuser-only operations console (#53); keep in sync with the front door.
    DJANGO_ADMIN_ENABLED: ${DJANGO_ADMIN_ENABLED:-true}
    DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:-admin}
    WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    WORKER_OFFLINE_SECONDS: ${WORKER_OFFLINE_SECONDS:-10}
    WORKER_SESSION_KEEP: ${WORKER_SESSION_KEEP:-500}
    WORKER_MESSAGE_KEEP: ${WORKER_MESSAGE_KEEP:-120}
    WORKER_EVENT_KEEP: ${WORKER_EVENT_KEEP:-5000}
    WORKER_EVENT_MAX_BYTES: ${WORKER_EVENT_MAX_BYTES:-65536}
    WORKER_SYNC_MAX_BYTES: ${WORKER_SYNC_MAX_BYTES:-8388608}
    WORKER_COMMAND_QUEUE_CAP: ${WORKER_COMMAND_QUEUE_CAP:-100}
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  web:
    <<: *web
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && exec uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers $${WEB_CONCURRENCY}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
  front:
    # Public TLS front door: SPA + same-origin proxy to Django.
    image: agents-task-manager-web:${IMAGE_TAG:-latest}
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.tls", "--adapter", "caddyfile"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      ADMIN_PATH: ${DJANGO_ADMIN_PATH:-admin}
      TLS: ${TLS:?Set to the ACME contact email (or internal for a staging rehearsal)}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # Certificates and ACME account; keep across deploys to avoid rate limits.
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # The image's check targets the plain :8080 front door; the deploy verifies
      # https://SITE_ADDRESS/healthz end to end instead.
      disable: true
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
  reaper:
    <<: *web
    command: ["sh", "-c", "while true; do python manage.py release_stale_tasks --minutes ${TASK_CLAIM_TIMEOUT_MINUTES:-15} || exit 1; sleep ${TASK_REAPER_INTERVAL_SECONDS:-300}; done"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  redis_data:
  caddy_data:
  caddy_config:
