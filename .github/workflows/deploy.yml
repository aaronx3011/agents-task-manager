name: Deploy

# Ship the image, then docker up on the target host. That's it.
# 1. Build the image once on the runner (10.8.0.6) tagged with the commit SHA.
# 2. Stream it over SSH (docker save | docker load) to the target host.
# 3. Sync the deploy files, bring the stack up, migrate, health check.
# - development runs automatically on every push to main (or manual dispatch).
# - production runs on manual dispatch only; the GitHub "production" environment
#   must have a required reviewer before this job can run.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [development, production]
        default: development

permissions:
  contents: read

concurrency:
  group: ship-${{ github.event.inputs.environment || 'development' }}
  cancel-in-progress: false

jobs:
  development:
    if: github.event_name == 'push' || inputs.environment == 'development'
    runs-on: [self-hosted, dev-runner]
    environment: development
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag agents-task-manager:${{ github.sha }} .
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEV_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Host 10.8.0.11
            StrictHostKeyChecking accept-new" > ~/.ssh/config
      - name: Ship the image over SSH
        run: docker save agents-task-manager:${{ github.sha }} | gzip | ssh -i ~/.ssh/deploy_key "${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_HOST }}" "gunzip | docker load"
      - name: Sync deploy files
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            --exclude '*.sqlite3*' --exclude .env --exclude __pycache__ \
            deploy scripts "${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_HOST }}:/opt/agents-task-manager/_tmp/" \
          && ssh -i ~/.ssh/deploy_key "${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_HOST }}" \
            "cd /opt/agents-task-manager && mkdir -p deploy scripts && cp -r _tmp/deploy _tmp/scripts . && rm -rf _tmp"
      - name: Docker up, migrate, health check
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_HOST }}" \
            "cd /opt/agents-task-manager && IMAGE_TAG=${{ github.sha }} bash scripts/deploy.sh development ${{ github.sha }}"
      - name: Verify from the runner over the VPN
        run: |
          curl -fsS --max-time 5 "http://${{ secrets.DEV_HOST }}:8000/healthz"
          echo
          echo "Development deployment verified: ${{ github.sha }}"
      - name: Report the deployment to the coordinator
        run: |
          AUTH="Authorization: Bearer ${{ secrets.COORDINATOR_API_KEY }}"
          BASE="${{ secrets.COORDINATOR_URL }}"
          TASK=$(curl -fsS --max-time 10 -X POST "$BASE/api/tasks" -H "$AUTH" -H "Content-Type: application/json" \
            -d '{"title":"Deploy '"${{ github.sha }}"' to development","project":"agents-task-manager",
                 "description":"Automated deployment report from the CI pipeline (run '"${{ github.run_id }}"').","priority":10}')
          ID=$(echo "$TASK" | jq -r .id)
          curl -fsS --max-time 10 -X POST "$BASE/api/tasks/$ID/claim" -H "$AUTH" -H "Content-Type: application/json" -d '{}' > /dev/null
          curl -fsS --max-time 10 -X POST "$BASE/api/tasks/$ID/status" -H "$AUTH" -H "Content-Type: application/json" \
            -d '{"status":"done","result_summary":"Image built on the runner, shipped over SSH, stack healthy on 10.8.0.11 (run '"${{ github.run_id }}"')."}' > /dev/null
          echo "Reported deployment as coordinator task #$ID"

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    runs-on: [self-hosted, dev-runner]
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag agents-task-manager:${{ github.sha }} .
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" | base64 -d > ~/.ssh/prod_deploy_key
          chmod 600 ~/.ssh/prod_deploy_key
      - name: Ship the image over SSH
        run: docker save agents-task-manager:${{ github.sha }} | gzip | ssh -i ~/.ssh/prod_deploy_key "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_HOST }}" "gunzip | docker load"
      - name: Sync deploy files
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/prod_deploy_key" \
            --exclude '*.sqlite3*' --exclude .env --exclude __pycache__ \
            deploy scripts "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_HOST }}:/opt/agents-task-manager/_tmp/" \
          && ssh -i ~/.ssh/prod_deploy_key "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_HOST }}" \
            "cd /opt/agents-task-manager && mkdir -p deploy scripts && cp -r _tmp/deploy _tmp/scripts . && rm -rf _tmp"
      - name: Docker up, migrate, health check (HTTPS reverse proxy required; see deploy/production/compose.yaml)
        run: |
          ssh -i ~/.ssh/prod_deploy_key "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_HOST }}" \
            "cd /opt/agents-task-manager && IMAGE_TAG=${{ github.sha }} bash scripts/deploy.sh production ${{ github.sha }}"
      - name: Verify
        run: curl -fsS --max-time 5 "https://${{ secrets.PROD_PUBLIC_HOST }}/healthz"
      - name: Report the deployment to the coordinator
        run: |
          AUTH="Authorization: Bearer ${{ secrets.COORDINATOR_API_KEY }}"
          BASE="${{ secrets.COORDINATOR_URL }}"
          TASK=$(curl -fsS --max-time 10 -X POST "$BASE/api/tasks" -H "$AUTH" -H "Content-Type: application/json" \
            -d '{"title":"Deploy '"${{ github.sha }}"' to production","project":"agents-task-manager",
                 "description":"Automated deployment report from the CI pipeline (run '"${{ github.run_id }}"').","priority":10}')
          ID=$(echo "$TASK" | jq -r .id)
          curl -fsS --max-time 10 -X POST "$BASE/api/tasks/$ID/claim" -H "$AUTH" -H "Content-Type: application/json" -d '{}' > /dev/null
          curl -fsS --max-time 10 -X POST "$BASE/api/tasks/$ID/status" -H "$AUTH" -H "Content-Type: application/json" \
            -d '{"status":"done","result_summary":"Production deployment completed (run '"${{ github.run_id }}"')."}' > /dev/null
          echo "Reported deployment as coordinator task #$ID"
