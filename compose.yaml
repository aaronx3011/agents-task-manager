x-app: &app
  build:
    context: .
    target: api
  environment: &environment
    DJANGO_DEBUG: "false"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
    DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
    DATABASE_URL: postgresql://coordinator:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/coordinator
    DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
    DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-false}
    # The front service below is the one trusted proxy.
    DJANGO_TRUST_PROXY: ${DJANGO_TRUST_PROXY:-true}
    DJANGO_NUM_PROXIES: ${DJANGO_NUM_PROXIES:-1}
    REDIS_URL: redis://redis:6379/0
    WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    WORKER_OFFLINE_SECONDS: ${WORKER_OFFLINE_SECONDS:-10}
    WORKER_SESSION_KEEP: ${WORKER_SESSION_KEEP:-500}
    WORKER_MESSAGE_KEEP: ${WORKER_MESSAGE_KEEP:-600}
    WORKER_EVENT_KEEP: ${WORKER_EVENT_KEEP:-5000}
    WORKER_EVENT_MAX_BYTES: ${WORKER_EVENT_MAX_BYTES:-65536}
    WORKER_SYNC_MAX_BYTES: ${WORKER_SYNC_MAX_BYTES:-8388608}
    WORKER_COMMAND_QUEUE_CAP: ${WORKER_COMMAND_QUEUE_CAP:-100}
    NOTION_TOKEN: ${NOTION_TOKEN:-}
    NOTION_PROJECTS_DATA_SOURCE_ID: ${NOTION_PROJECTS_DATA_SOURCE_ID:-}
    NOTION_TASKS_DATA_SOURCE_ID: ${NOTION_TASKS_DATA_SOURCE_ID:-}
    NOTION_SYNC_INTERVAL_SECONDS: ${NOTION_SYNC_INTERVAL_SECONDS:-20}
    FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
    FIREWORKS_MODEL: ${FIREWORKS_MODEL:-accounts/fireworks/models/minimax-m3p1-flash}
    PM_MAX_MESSAGES: ${PM_MAX_MESSAGES:-1000}
    PM_MAX_HISTORY_BYTES: ${PM_MAX_HISTORY_BYTES:-1200000}
    PM_MAX_OUTPUT_TOKENS: ${PM_MAX_OUTPUT_TOKENS:-8192}
    PM_CONTEXT_WINDOW_TOKENS: ${PM_CONTEXT_WINDOW_TOKENS:-524288}
    ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
    ELEVENLABS_STT_MODEL: ${ELEVENLABS_STT_MODEL:-scribe_v3}
    ELEVENLABS_TTS_MODEL: ${ELEVENLABS_TTS_MODEL:-eleven_v4_turbo}
    VOICE_PUBLIC_ORIGIN: ${VOICE_PUBLIC_ORIGIN:-https://atm.aaron-henriquez.com}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coordinator
      POSTGRES_USER: coordinator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coordinator -d coordinator"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    <<: *app
    command: ["sh", "-c", "exec uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers $${WEB_CONCURRENCY}"]
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  front:
    # SPA + same-origin proxy to Django (#50): http://localhost:8000
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:8000:8080"
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
  reaper:
    <<: *app
    command: ["sh", "-c", "while true; do python manage.py release_stale_tasks --minutes ${TASK_CLAIM_TIMEOUT_MINUTES:-15} || exit 1; sleep ${TASK_REAPER_INTERVAL_SECONDS:-300}; done"]
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy

  notion-sync:
    <<: *app
    # One-way Notion mirror (GH #94); idles when NOTION_TOKEN is empty.
    command: ["python", "manage.py", "sync_notion", "--loop"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
